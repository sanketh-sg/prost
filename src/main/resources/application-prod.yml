spring:
    datasource:
        username: ${DB_USER:postgres}
        password: ${DB_PASSWD:strongpassword}
        url: ${DB_URL:jdbc:postgresql://localhost:5432/prost}
        driver-class-name: org.postgresql.Driver
        hikari:
            maximum-pool-size: 5
        tomcat:
            max-active: 5
            max-idle: 5
    jpa:
        hibernate:
            ddl-auto: update
    thymeleaf:
        cache: true
server:
    servlet:
        session:
            cookie:
                http-only: true
                secure: true
    forward-headers-strategy: native