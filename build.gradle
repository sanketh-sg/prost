plugins {
    id 'java'
    id 'org.springframework.boot' version '2.7.5'
    id 'io.spring.dependency-management' version '1.0.15.RELEASE'
    id 'com.diffplug.spotless' version '6.11.0'
}

group = 'de.unibamberg.dsam.group6'
version = '0.0.1-SNAPSHOT'

// sourceCompatibility on the project is a JavaPluginConvention, deprecated in
// Gradle 8 and removed in 9. The toolchain block also makes Gradle provision a
// matching JDK rather than relying on whatever JAVA_HOME happens to be.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    developmentOnly
    runtimeClasspath {
        extendsFrom developmentOnly
    }
}

repositories {
    mavenCentral()
}

dependencies {
    //region Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    //endregion

    //region Spring other
    implementation 'org.springframework.session:spring-session-jdbc'
    // Test-only: was declared 'implementation', which shipped test scaffolding
    // into the production jar.
    testImplementation 'org.springframework.security:spring-security-test'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    //endregion

    //region thymeleaf
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity5'
    implementation 'com.github.bufferings:thymeleaf-extras-nl2br:1.0.2'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-java8time:3.0.4.RELEASE'
    //endregion

    implementation 'org.hibernate.validator:hibernate-validator'
    implementation 'org.postgresql:postgresql'
    implementation 'org.apache.commons:commons-lang3'
    implementation 'com.fasterxml.jackson.core:jackson-core'
    developmentOnly 'com.h2database:h2'
    // developmentOnly only feeds runtimeClasspath, not testRuntimeClasspath, so
    // tests on the dev profile cannot load org.h2.Driver without this.
    testRuntimeOnly 'com.h2database:h2'

    annotationProcessor 'org.projectlombok:lombok'
    compileOnly 'org.projectlombok:lombok'
}

bootJar {
    // Gradle 8 removed archiveName in favour of archiveFileName.
    archiveFileName = "prost.jar"
}

tasks.named('test') {
    useJUnitPlatform()
}

spotless {
    format 'misc', {
        target '*.gradle', '*.md', '.gitignore'

        trimTrailingWhitespace()
        indentWithSpaces()
        endWithNewline()
    }

    java {
        target 'src/*/java/**/*.java'
        indentWithSpaces(4)
        palantirJavaFormat()
    }
}
