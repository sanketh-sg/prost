plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.0'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'com.diffplug.spotless' version '6.11.0'
}

group = 'de.unibamberg.dsam.group6'
version = '0.0.1-SNAPSHOT'

// sourceCompatibility on the project is a JavaPluginConvention, deprecated in
// Gradle 8 and removed in 9. The toolchain block also makes Gradle provision a
// matching JDK rather than relying on whatever JAVA_HOME happens to be.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    developmentOnly
    runtimeClasspath {
        extendsFrom developmentOnly
    }
}

repositories {
    mavenCentral()
}

dependencies {
    //region Spring Boot
    // starter-jdbc removed: starter-data-jpa already brings spring-jdbc and
    // HikariCP, which is all spring-session-jdbc needs.
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    //endregion

    //region Spring other
    implementation 'org.springframework.session:spring-session-jdbc'
    // Test-only: was declared 'implementation', which shipped test scaffolding
    // into the production jar.
    testImplementation 'org.springframework.security:spring-security-test'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    //endregion

    //region thymeleaf
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    // thymeleaf-extras-nl2br removed: the three templates that used it now use
    // th:text with Tailwind's whitespace-pre-line, which renders newlines in CSS
    // instead of generating <br> tags.
    // thymeleaf-extras-java8time removed: the Java8TimeDialect bean was registered
    // but no template uses temporals.*, and the dialect is folded into Thymeleaf 3.1.
    //endregion

    implementation 'org.hibernate.validator:hibernate-validator'

    // Flyway replaces ddl-auto on prod. Boot 3.0 manages Flyway 9.5.1, which still
    // bundles Postgres support; the separate flyway-database-postgresql artifact is
    // only needed from Flyway 10.
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.postgresql:postgresql'
    // commons-lang3 removed: nothing imported it. jackson-core removed: the only
    // Jackson usage is ObjectMapper from jackson-databind, which starter-web brings.
    developmentOnly 'com.h2database:h2'
    // developmentOnly only feeds runtimeClasspath, not testRuntimeClasspath, so
    // tests on the dev profile cannot load org.h2.Driver without this.
    testRuntimeOnly 'com.h2database:h2'

    annotationProcessor 'org.projectlombok:lombok'
    compileOnly 'org.projectlombok:lombok'
}

bootJar {
    // Gradle 8 removed archiveName in favour of archiveFileName.
    archiveFileName = "prost.jar"
}

// The bundle in src/main/resources/static/build is gitignored, so without this a
// fresh clone packages a jar with no CSS or JS. pnpm is invoked through cmd on
// Windows because Exec cannot launch a .cmd shim directly.
def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
def pnpm = { List<String> args -> (isWindows ? ['cmd', '/c', 'pnpm'] : ['pnpm']) + args }

tasks.register('frontendInstall', Exec) {
    description = 'Installs frontend dependencies with pnpm.'
    group = 'build'
    inputs.files('package.json', 'pnpm-lock.yaml')
    // Snapshotting all of node_modules would be far slower than the install
    // itself; this marker file is rewritten by every pnpm install.
    outputs.file('node_modules/.modules.yaml')
    commandLine pnpm(['install', '--frozen-lockfile'])
}

tasks.register('frontendBuild', Exec) {
    description = 'Bundles the frontend into src/main/resources/static/build.'
    group = 'build'
    dependsOn 'frontendInstall'
    inputs.files('package.json', 'webpack.config.js', 'tailwind.config.js', 'postcss.config.js')
    inputs.dir('frontend')
    // Tailwind scans the templates to decide which utilities to emit, so a
    // template edit changes the generated CSS.
    inputs.dir('src/main/resources/templates')
    outputs.dir('src/main/resources/static/build')
    commandLine pnpm(['run', 'build:prod'])
}

processResources.dependsOn 'frontendBuild'

tasks.named('test') {
    useJUnitPlatform()
}

spotless {
    format 'misc', {
        target '*.gradle', '*.md', '.gitignore'

        trimTrailingWhitespace()
        indentWithSpaces()
        endWithNewline()
    }

    java {
        target 'src/*/java/**/*.java'
        indentWithSpaces(4)
        palantirJavaFormat()
    }
}
